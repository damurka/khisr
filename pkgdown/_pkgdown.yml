url: https://khisr.damurka.com

development:
  mode: auto

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  includes:
    in_header:
      <script data-goatcounter="https://khisr.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

authors:
  David Kariuki:
    href: https://damurka.com

articles:
  - title: Common Uses
    navbar: ~
    contents:
    - khisr
    - articles/data-dimensions
    - articles/date-format
    - articles/tracker
    - articles/set-your-credentials

reference:
  - title: "Authorization Credentials"
    desc: >
      Set and securely store the DHIS2 authorization credentials
    contents:
      - khis_cred
      - khis_has_cred
      - khis_cred_clear
      - khis_username
      - khis_display_name
      - khis_base_url
      - khis_api_version
      - khisr-configuration
  - title: "DHIS2 Metadata"
    desc: >
      Download metadata information from DHIS2
    contents:
      - get_metadata
      - metadata-helpers
      - metadata-filter
  - title: "DHIS2 Analytics"
    desc: >
      To access analytical, aggregated data in DHIS2, and the raw data values
      behind it
    contents:
      - get_analytics
      - analytics-dimension
      - get_data_value_sets
      - get_event_analytics
      - get_enrollment_analytics
  - title: "DHIS2 Tracker"
    desc: >
      Retrieve tracked entities, events, enrollments, and relationships from
      DHIS2's Tracker API
    contents:
      - get_tracked_entities
      - get_events
      - get_enrollments
      - get_relationships
      - tracked_entity_filter
  - title: "Experimental Functions"
    desc: >
        Experimental functions that formats the data in logical manner
    contents:
        - get_analytics_by_level
        - get_data_elements_with_category_options
        - get_data_sets_by_level
        - get_organisations_by_level
